id = "poislagarde.branch-labels"
name = "Branch Labels"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Format sidebar branch labels with a configurable regular expression."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["./target/release/herdr-branch-labels", "refresh"]

[[actions]]
id = "refresh"
title = "Refresh sidebar branch labels"
contexts = ["workspace"]
command = ["./target/release/herdr-branch-labels", "refresh"]

[[events]]
on = "workspace.created"
command = ["./target/release/herdr-branch-labels", "refresh"]

[[events]]
on = "workspace.updated"
command = ["./target/release/herdr-branch-labels", "refresh"]

[[events]]
on = "workspace.renamed"
command = ["./target/release/herdr-branch-labels", "refresh"]

[[events]]
on = "workspace.closed"
command = ["./target/release/herdr-branch-labels", "refresh"]

[[events]]
on = "workspace.focused"
command = ["./target/release/herdr-branch-labels", "refresh"]

[[events]]
on = "pane.focused"
command = ["./target/release/herdr-branch-labels", "refresh"]

[[events]]
on = "worktree.created"
command = ["./target/release/herdr-branch-labels", "refresh"]

[[events]]
on = "worktree.opened"
command = ["./target/release/herdr-branch-labels", "refresh"]
